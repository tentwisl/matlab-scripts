plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig "mca.mixin.json"
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

repositories {
    maven { url "https://maven.ftb.dev/releases" }
    maven { url "https://maven.architectury.dev/" }
    maven { url "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" }
    maven { url "https://dl.cloudsmith.io/public/tslat/sbl/maven/" }
    maven { url "https://maven.saps.dev/minecraft" }

    // FIXED: Swapped the broken Xaero maven for Modrinth's highly reliable Maven
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }

    maven { url "https://maven.blamejared.com/" }
    maven { url "https://modmaven.dev/" }
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.forge_version}"

    // Architectury Forge
    modApi "dev.architectury:architectury-forge:${rootProject.architectury_version}"

    // FTB Library Forge
    modImplementation "dev.ftb.mods:ftb-library-forge:${rootProject.ftb_library_version}"

    // GeckoLib Forge
    modImplementation "software.bernie.geckolib:geckolib-forge-1.20.1:${rootProject.geckolib_version}"

    // SmartBrainLib Forge
    modImplementation "net.tslat.smartbrainlib:SmartBrainLib-forge-1.20.1:${rootProject.smartbrainlib_version}"

    // FIXED: Formatted for Modrinth Maven (maven.modrinth:<project-slug>:<version>)
    modRuntimeOnly "maven.modrinth:xaeros-world-map:${rootProject.xaerosworldmap_version}_Forge_1.20"
    modRuntimeOnly "maven.modrinth:xaeros-minimap:${rootProject.xaerosminimap_version}_Forge_1.20"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowCommon project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.artifactId
            groupId = rootProject.groupId
            version = version + "+forge"
            from components.java
        }
    }
}