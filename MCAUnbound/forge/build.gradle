plugins {
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig "mca.mixin.json"
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

repositories {
    // GeckoLib
    maven { url "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" }
    // MCLib (GeckoLib runtime dependency)
    maven { url "https://maven.blamejared.com" }
    // SmartBrainLib
    maven { url "https://dl.cloudsmith.io/public/tslat/sbl/maven/" }
    // FTB Library
    maven { url "https://maven.saps.dev/minecraft" }
}

dependencies {
    forge "net.minecraftforge:forge:$rootProject.forge_version"
    modApi "dev.architectury:architectury-forge:$rootProject.architectury_version"

    // GeckoLib — model loading + animation framework
    modImplementation "software.bernie.geckolib:geckolib-forge-1.20.1:${rootProject.geckolib_version}"
    implementation "com.eliotlash.mclib:mclib:20"
    runtimeOnly "com.eliotlash.mclib:mclib:20"

    // SmartBrainLib — declarative AI brain system for entities
    modImplementation "net.tslat.smartbrainlib:SmartBrainLib-forge-1.20.1:${rootProject.smartbrainlib_version}"

    // FTB Library — GUI creation framework and utilities (used for villager interaction UI)
    modImplementation "dev.ftb.mods:ftb-library-forge:${rootProject.ftb_library_version}"


    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowCommon project(path: ':common', configuration: 'transformProductionForge')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenCommon(MavenPublication) {
            artifactId = rootProject.artifactId
            groupId = rootProject.groupId
            version = version + "+forge"
            from components.java
        }
    }
}
