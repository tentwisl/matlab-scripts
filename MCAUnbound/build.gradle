plugins {
    id 'java-library'
    id 'architectury-plugin' version '3.4.151'
    id 'dev.architectury.loom' version '1.7-SNAPSHOT' apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

def getAppVersion = { ->
    try {
        def stdout = new ByteArrayOutputStream()
        exec {
            commandLine 'git', 'describe', '--tags', '--abbrev=0'
            standardOutput = stdout
        }
        return stdout.toString().trim()
    } catch (Exception e) {
        return rootProject.mod_version
    }
} as Object

subprojects {
    apply plugin: 'dev.architectury.loom'

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"
    }
}

allprojects {
    apply plugin: "maven-publish"
    apply plugin: 'architectury-plugin'

    group = rootProject.groupId
    archivesBaseName = rootProject.name
    version = getAppVersion()

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = 17
    }

    repositories {
        maven { url "https://maven.ftb.dev/releases" }
        maven { url "https://maven.architectury.dev/" }
        maven { url "https://maven.saps.dev/minecraft" }
        maven { url "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" }
        maven { url "https://dl.cloudsmith.io/public/tslat/sbl/maven/" }
        // Added for JEI (required by FTB Library)
        maven { url "https://maven.blamejared.com/" }
        maven { url "https://modmaven.dev/" }
    }
}